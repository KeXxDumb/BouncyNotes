name: Build check (PR)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # No firma ni release: solo verificar que el código compila antes de
      # mergear. El workflow de Release sigue disparándose solo en main.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
